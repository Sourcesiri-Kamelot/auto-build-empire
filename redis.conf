# Redis Production Configuration for Agent Architecture 3.0
# Optimized for message broker usage, not cache

# Persistence: AOF for task durability
appendonly yes
appendfsync everysec

# Memory: Never evict tasks
maxmemory-policy noeviction

# Streams: Prevent unbounded growth
stream-node-max-bytes 4096
stream-node-max-entries 100

# Performance
tcp-keepalive 300
timeout 0
